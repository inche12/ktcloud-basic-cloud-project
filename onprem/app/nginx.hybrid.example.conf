log_format hybrid '$remote_addr [$time_local] "$request" $status '
                  'rt=$request_time up=$upstream_addr '
                  'urt=$upstream_response_time';

upstream pretix_pool {
    zone pretix_zone 64k;

    # 한계 측정 중에는 max_conns를 임시 제거할 수 있음.
    server pretix:80 max_conns=25;

    # AWS 준비 후 실제 ALB DNS로 변경하고 활성화.
    # server <ALB_DNS_NAME>:80 backup;
}

server {
    listen 80;
    client_max_body_size 20m;

    access_log /var/log/nginx/access.log hybrid;

    location / {
        proxy_pass http://pretix_pool;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Served-By $upstream_addr always;
    }
}

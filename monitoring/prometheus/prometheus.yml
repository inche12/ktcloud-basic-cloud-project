global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "app-node"
    static_configs:
      - targets:
          - "192.168.120.152:9100"

  - job_name: "app-cadvisor"
    static_configs:
      - targets:
          - "192.168.120.152:8080"

  - job_name: "data-node"
    static_configs:
      - targets:
          - "192.168.120.153:9100"

  - job_name: "data-cadvisor"
    static_configs:
      - targets:
          - "192.168.120.153:8080"

  # Team Rocky target example (network path required):
  # - job_name: "team-rocky-node"
  #   static_configs:
  #     - targets: ["<ROCKY_IP>:9100"]
  #
  # - job_name: "team-rocky-cadvisor"
  #   static_configs:
  #     - targets: ["<ROCKY_IP>:8080"]
